version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: braids
    main: ./cmd/braids
    binary: braids
    env: [CGO_ENABLED=0]          # pure-Go sqlite: no cgo, so cross-compiles cleanly
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    # Windows gets a zip, which is what a Windows machine can open without
    # installing something first.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt


changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
